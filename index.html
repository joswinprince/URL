<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog Links</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 20px 0;
    }
    h1 {
      color: #2c3e50;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      background-color: #fff;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px 15px;
      text-align: left;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    a {
      color: #3498db;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Favorite Blogs</h1>
    <p>A simple blog-style table of useful links</p>
  </header>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>URL</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>GitHub</td>
        <td><a href="https://github.com" target="_blank">https://github.com</a></td>
      </tr>
      <tr>
        <td>MDN Web Docs</td>
        <td><a href="https://developer.mozilla.org" target="_blank">https://developer.mozilla.org</a></td>
      </tr>
      <tr>
        <td>Stack Overflow</td>
        <td><a href="https://stackoverflow.com" target="_blank">https://stackoverflow.com</a></td>
      </tr>
      <tr>
        <td>Google chrometesting website</td>
        <td><a href="https://googlechromelabs.github.io/chrome-for-testing" target="_blank">https://googlechromelabs.github.io/chrome-for-testing</a></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
